<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parcheggi · ParkBeat</title><meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data.js"></script><script src="common.js"></script>
</head><body>
<header class="hdr"><div class="in"><a class="brand" href="./"><span class="mark">P</span>ParkBeat</a><a class="lnk" href="./">‹ Tutti gli eventi</a></div></header>
<main id="m"></main>
<script>
const id=new URLSearchParams(location.search).get('id');const e=window.EVENTI.find(x=>x.id===id);const M=document.getElementById('m');
if(!e){M.innerHTML='<section class="band w"><div class="in"><h1>Evento non trovato</h1><p class="sub"><a href="./">Torna agli eventi</a></p></div></section>'}else{
document.title='Parcheggi per '+e.nome+' · ParkBeat';
M.innerHTML=`<img class="hero" src="img/placeholder_${e.cat}.svg" alt="${CAT[e.cat]}">
<section class="band w"><div class="in"><div class="tags" style="margin:0 0 10px"><span class="tag">${CAT[e.cat]}</span>${e.ver?'':'<span class="tag">Da verificare</span>'}</div>
<h1>Parcheggi per ${esc(e.nome)}</h1><div class="meta"><span>${range(e)}</span><span>${esc(e.comune)} (${esc(e.prov)})</span></div>${e.luogo?`<p class="sub" style="margin-top:6px">${esc(e.luogo)}</p>`:''}</div></section>
${e.lat!=null?'<section class="band flush"><div id="map" class="map" style="height:300px"></div></section>':''}
<section class="band g es"><div class="in"><h2>Non ci sono ancora parcheggi per questo evento.</h2><p class="sub">Abiti vicino? Crea il tuo posto e guadagna.</p><a class="btn" href="#host">Inserisci il tuo posto</a></div></section>
<section class="band w"><div class="in">${e.url?`<a class="src" href="${esc(e.url)}" target="_blank" rel="noopener"><span>Fonte ufficiale<small>${esc(e.fonte||new URL(e.url).hostname)}</small></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666A73" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`:'<span class="sub">Fonte ufficiale non disponibile</span>'}</div></section>
<section class="band g"><div class="in foot">ParkBeat · Demo</div></section>`;
if(e.lat!=null){const map=L.map('map',{zoomControl:false,scrollWheelZoom:false}).setView([e.lat,e.lon],15);tiles(map);L.marker([e.lat,e.lon],{icon:L.divIcon({className:'',html:'<div class="ev"></div>',iconSize:[0,0]})}).addTo(map)}}
</script></body></html>
