<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eventi in Romagna · ParkBeat</title><meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="data.js"></script><script src="common.js"></script>
</head><body>
<header class="hdr"><div class="in"><a class="brand" href="./"><span class="mark">P</span>ParkBeat</a><a class="lnk" href="#host">Offri un posto</a></div></header>
<section class="band w"><div class="in">
<h1>Eventi in Romagna</h1><p class="sub">Partite, fiere, mercati e sagre a Forlì‑Cesena, Ravenna e Rimini. Scegli l'evento e prenota il parcheggio da chi abita vicino.</p>
</div></section>
<section class="band g" style="padding-top:16px;padding-bottom:16px"><div class="in">
<div class="chips" id="chips"></div>
<div class="frow"><select id="prov"><option value="">Provincia</option><option>Forlì-Cesena</option><option>Ravenna</option><option>Rimini</option></select>
<input id="q" type="search" placeholder="Cerca evento o comune"></div>
</div></section>
<section class="band flush"><div id="map" class="map"></div></section>
<section class="band w"><div class="in">
<div class="cnt"><h2>Prossimi eventi</h2><span id="count"></span></div>
<div id="list"></div></div></section>
<section class="band g"><div class="in foot">ParkBeat · Demo · Dati eventi: Emilia‑Romagna Turismo Open Data (CC BY 4.0) e fonti ufficiali</div></section>
<script>
const E=window.EVENTI.slice().sort((a,b)=>shown(a).localeCompare(shown(b))||a.nome.localeCompare(b.nome));
let cat='',sel=null;
const chips=document.getElementById('chips');
[['','Tutti'],...Object.entries(CAT)].forEach(([k,v])=>{const b=document.createElement('button');b.className='chip'+(k===''?' on':'');b.textContent=v;b.onclick=()=>{cat=k;[...chips.children].forEach(c=>c.classList.toggle('on',c===b));render()};chips.appendChild(b)});
const map=L.map('map',{zoomControl:false,scrollWheelZoom:false}).setView([44.15,12.2],9);tiles(map);
const cg=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:28,iconCreateFunction:c=>L.divIcon({className:'',html:'<div class="cl">'+c.getChildCount()+'</div>',iconSize:[34,34]})}).addTo(map);
const lbl=e=>{const d=pd(shown(e));return d.getDate()+' '+MESI[d.getMonth()]};
const go=e=>location.href='evento.html?id='+encodeURIComponent(e.id);
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase(),p=document.getElementById('prov').value;
 const F=E.filter(e=>(!cat||e.cat===cat)&&(!p||e.prov===p)&&(!q||(e.nome+' '+e.comune+' '+e.luogo).toLowerCase().includes(q)));
 cg.clearLayers();const pts=[];
 F.forEach(e=>{if(e.lat==null)return;const m=L.marker([e.lat,e.lon],{icon:L.divIcon({className:'',html:'<div class="pm" data-id="'+e.id+'">'+lbl(e)+'</div>',iconSize:[0,0]}),title:e.nome});
  m.on('click',()=>{if(sel===e.id)go(e);else{sel=e.id;mark()}});cg.addLayer(m);pts.push([e.lat,e.lon])});
 if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:13});
 const onMap=pts.length;
 document.getElementById('count').textContent=F.length+' eventi · '+onMap+' sulla mappa';
 document.getElementById('list').innerHTML=F.length?F.map(e=>{const d=pd(shown(e));return '<a class="row" data-id="'+e.id+'" href="evento.html?id='+encodeURIComponent(e.id)+'"><div class="dt"><b>'+d.getDate()+'</b><small>'+MESI[d.getMonth()]+'</small></div><div class="rt"><div class="rn">'+esc(e.nome)+'</div><div class="rm">'+esc(e.comune)+' · '+range(e)+'</div><div class="tags"><span class="tag">'+CAT[e.cat]+'</span><span class="tag np">Nessun parcheggio ancora</span></div></div><svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></a>'}).join(''):'<div class="empty">Nessun evento trovato con questi filtri.</div>';
 mark();
}
function mark(){document.querySelectorAll('.pm').forEach(x=>x.classList.toggle('sel',x.dataset.id===sel));document.querySelectorAll('.row').forEach(x=>x.classList.toggle('sel',x.dataset.id===sel))}
map.on('zoomend moveend',mark);cg.on('animationend',mark);
document.getElementById('q').oninput=render;document.getElementById('prov').onchange=render;
render();
</script></body></html>
